{t:"The Central Role of Therapeutic Alliance in Psychotherapy Outcomes",z:"治療聯盟在心理治療結果中的核心角色（改寫自 Flückiger et al., 2012）",
en:["The therapeutic alliance has long been recognized as one of the most robust predictors of treatment outcome across diverse therapeutic approaches. This multilevel longitudinal meta-analysis examined the association between the alliance and treatment outcomes across multiple studies, controlling for potential confounding variables such as treatment setting, client characteristics, and theoretical orientation.","The alliance, originally conceptualized by Bordin (1979), encompasses three interdependent components: the agreement on treatment goals, the consensus on tasks, and the emotional bond between client and therapist. Despite the widespread recognition of its importance, questions remain regarding the strength and consistency of the alliance-outcome relationship across different populations, treatment modalities, and phases of therapy.","A comprehensive literature search identified studies published in peer-reviewed journals that measured the alliance using validated instruments, including the Working Alliance Inventory (WAI) and the California Psychotherapy Alliance Scales (CALPAS). The final sample comprised over 200 studies representing more than 14,000 clients receiving various forms of psychotherapy, including cognitive behavioral therapy, psychodynamic therapy, humanistic approaches, and integrative treatments.","Multilevel modeling results revealed a robust and consistent association between the alliance and treatment outcomes across studies. The alliance remained a significant predictor even after controlling for prior symptom change, suggesting that its contribution extends beyond mere response to early improvement. Furthermore, the alliance-outcome relationship was moderated by treatment setting, with stronger associations observed in outpatient compared to inpatient settings.","The findings underscore the importance of attending to the therapeutic relationship as a common factor across therapeutic approaches. Clinicians are encouraged to monitor alliance quality throughout treatment, as ruptures in the alliance, if left unaddressed, can undermine treatment effectiveness and contribute to premature termination. The identification of specific client and therapist characteristics that facilitate or hinder alliance development remains an important direction for future research."],
zh:["長期以來，治療聯盟被公認為跨各種治療取向中最穩健的治療結果預測因子之一。這項多層次縱貫後設分析，在控制治療情境、個案特徵與理論取向等潛在混淆變項後，檢驗多項研究中聯盟與治療結果的關聯。","聯盟最初由Bordin（1979）提出，包含三個相互依存的成分：治療目標的共識、任務的共識，以及個案與治療師之間的情感連結。儘管其重要性廣獲認同，聯盟與結果的關係在不同族群、治療模式與治療階段中的強度與一致性仍有疑問。","全面的文獻搜尋找出刊登於同儕審查期刊、並以有效工具測量聯盟的研究，包括工作聯盟量表（WAI）與加州心理治療聯盟量表（CALPAS）。最終樣本含200多篇研究，代表超過14,000名接受各類心理治療的個案，包括認知行為治療、心理動力治療、人本取向與整合式治療。","多層次模型結果顯示，各研究中聯盟與治療結果有穩健且一致的關聯。即使控制先前的症狀改變，聯盟仍是顯著的預測因子，表示其貢獻不只是對早期改善的反應。此外，聯盟與結果的關係受治療情境調節，門診的關聯強於住院。","研究結果強調，應重視治療關係為跨取向的共同因子。建議臨床工作者全程監控聯盟品質，因為聯盟破裂若未處理，會削弱治療成效並導致提早終止。促進或阻礙聯盟發展的個案與治療師特徵，仍是未來研究的重要方向。"],
qa:[["1. What are the three components of the alliance? 治療聯盟的三個組成要素？","①治療目標共識（agreement on goals）②任務共識（consensus on tasks）③情感連結（emotional bond）。Bordin（1979）提出，且三者相互依存。口說：According to Bordin, the alliance has three interdependent components: goals, tasks, and bond."],["2. How many studies and clients were included? 包含多少研究與個案？","200多篇研究、超過14,000名個案；涵蓋CBT、心理動力、人本與整合式治療。口說：The meta-analysis included over 200 studies and more than 14,000 clients."],["3. Which measures were used? 使用哪些測量工具？","工作聯盟量表 WAI 與加州心理治療聯盟量表 CALPAS（皆為有效工具，且研究須發表於同儕審查期刊）。"],["4. Is the alliance–outcome link consistent across contexts? 關係在不同情境是否一致？","整體穩健且一致，但受治療情境調節：門診比住院更強。即使控制先前症狀改變仍顯著，代表聯盟不只是早期好轉的結果。作者也坦言在不同族群、模式與階段的強度與一致性仍有疑問。"],["5. What do the authors recommend to clinicians? 對臨床工作者的建議？","全程監控聯盟品質，並把治療關係視為跨取向的共同因子。連結實務：我會在每次會談結束時詢問個案對這次談話的感受。"],["6. What if ruptures go unaddressed? 聯盟破裂未處理的後果？","削弱治療成效（undermine treatment effectiveness），並導致提早終止（premature termination）。連結實務：發現破裂時要及早談開並修復。"],["Bonus: limitations / next question","此為模擬統整文，結果是關聯而非因果；門診與住院的差異不能直接推到所有個案。未來方向：哪些個案與治療師特徵促進或阻礙聯盟。口說：Further research should identify which client and therapist characteristics shape the alliance."]]},
{t:"Cognitive Behavioral Therapy for Depression: Mechanisms of Change and Treatment Efficacy",z:"認知行為治療與憂鬱症：改變機制與治療療效",
en:["Cognitive Behavioral Therapy (CBT) is one of the most widely researched and empirically supported treatments for major depressive disorder. Grounded in the cognitive model of emotional disorders, CBT posits that maladaptive cognitive schemas and distorted thinking patterns contribute to the maintenance of depressive symptoms. The therapeutic approach involves the collaborative identification and modification of dysfunctional cognitions through cognitive restructuring and behavioral activation.","The cognitive model, originally developed by Beck, suggests that individuals with depression exhibit a negative cognitive triad characterized by negative views of the self, the world, and the future. These cognitive distortions, including all-or-nothing thinking, overgeneralization, and catastrophizing, are reinforced by maladaptive behavioral patterns such as social withdrawal and reduced engagement in reinforcing activities.","A typical course of CBT for depression spans 12 to 20 sessions, incorporating both cognitive and behavioral techniques. Cognitive restructuring involves teaching clients to identify automatic thoughts, evaluate the evidence for and against these cognitions, and develop more balanced alternative interpretations. Behavioral activation, a key component particularly for clients with severe depressive symptoms, focuses on systematically increasing engagement in activities associated with pleasure and mastery.","Outcome research has consistently demonstrated the efficacy of CBT for depression, with response rates ranging from 40% to 60% across studies. Meta-analytic findings suggest that CBT is as effective as pharmacotherapy in treating mild to moderate depression, and the combination of CBT and medication may be superior to either treatment alone for severe depression. Furthermore, CBT has been associated with lower relapse rates compared to pharmacotherapy, potentially due to the acquisition of coping skills that clients can utilize beyond the termination of treatment.","Despite its demonstrated efficacy, several challenges remain. Dropout rates in CBT for depression range from 20% to 30%, with higher rates observed among clients with severe symptoms, comorbid personality disorders, or limited insight into the cognitive model. The therapeutic alliance has been identified as a significant predictor of both treatment retention and outcome, suggesting that technical adherence alone is insufficient for optimal results."],
zh:["認知行為治療（CBT）是針對重度憂鬱症研究最廣、最具實證支持的治療之一。CBT以情緒障礙的認知模型為基礎，主張適應不良的認知基模與扭曲的思考模式，促成憂鬱症狀的持續。此治療取向透過認知重建與行為活化，合作辨識並修正功能失調的認知。","認知模型最初由Beck提出，指出憂鬱者會呈現負向認知三角，即對自己、世界與未來的負面看法。這些認知扭曲，包括全有全無思考、過度類化與災難化，會因社交退縮、減少參與具增強作用的活動等適應不良行為模式而被強化。","憂鬱症的CBT典型療程為12至20次，結合認知與行為技術。認知重建是教導個案辨識自動化思考、評估支持與反對這些想法的證據，並發展更平衡的替代詮釋。行為活化是關鍵成分，特別適用於憂鬱症狀嚴重的個案，著重有系統地增加參與帶來愉悅感與掌控感的活動。","結果研究一致證實CBT對憂鬱症的療效，各研究反應率約40%至60%。後設分析顯示，對輕至中度憂鬱，CBT與藥物治療同樣有效；對重度憂鬱，CBT加藥物的合併治療可能優於單一治療。此外，CBT的復發率低於藥物治療，可能是因個案習得的因應技巧在結案後仍可運用。","儘管療效已獲證實，仍有一些挑戰。憂鬱症CBT的中輟率為20%至30%，在症狀嚴重、共病人格障礙，或對認知模型洞察有限的個案中更高。治療聯盟已被確認為留置與結果的顯著預測因子，顯示僅靠技術遵循不足以達到最佳成果。"],
qa:[["1. Theoretical basis of CBT for depression? CBT治療憂鬱症的理論基礎？","認知模型：適應不良的認知基模與扭曲思考維持憂鬱症狀；透過合作辨識並修正功能失調認知，方法為認知重建與行為活化。口說：CBT is grounded in the cognitive model, which holds that distorted thinking maintains depression."],["2. What is the negative cognitive triad? 負向認知三角？","Beck提出：對自己、世界、未來的負面看法。伴隨全有全無思考、過度類化、災難化，並被社交退縮、減少增強性活動所強化。"],["3. Steps of cognitive restructuring? 認知重建的步驟？","①辨識自動化思考 ②評估支持與反對的證據 ③發展更平衡的替代詮釋。"],["4. Who is behavioral activation for? 行為活化針對誰？","特別是憂鬱症狀嚴重的個案；有系統地增加帶來愉悅感與掌控感的活動，打破退縮與低活動的循環。"],["5. Approximate response rate? 治療反應率？","約40%–60%。另補充：輕中度憂鬱CBT與藥物同樣有效，重度憂鬱合併治療可能更佳。"],["6. Why lower relapse than medication? 為何復發率較低？","個案習得因應技巧（coping skills），結案後仍可持續運用，所以不依賴持續服藥。"],["7. Role of the alliance in CBT? 聯盟的角色？","是留置率與治療結果的顯著預測因子，顯示僅有技術遵循（technical adherence）不夠。連結實務：先建立關係，再談認知作業。"],["Bonus: limitations / next question","中輟率20–30%，症狀嚴重、共病人格障礙或洞察有限者更高；反應率僅40–60%，代表近半個案未達反應。口說：Despite its efficacy, dropout remains a challenge, so I would strengthen the alliance early."]]},
{t:"Solution-Focused Brief Therapy in School Counseling: A Strengths-Based Approach",z:"焦點解決短期治療在學校諮商中的應用：優勢本位取向",
en:["Solution-Focused Brief Therapy (SFBT) has gained increasing recognition as an effective therapeutic approach in school counseling settings. Developed by de Shazer and Berg, SFBT represents a paradigm shift from deficit-oriented models toward a strengths-based, future-focused approach to facilitating change. Unlike traditional therapeutic models that emphasize problem analysis and historical exploration, SFBT focuses on constructing solutions by amplifying clients' existing resources, strengths, and exceptions to the problem.","The foundational assumptions of SFBT include the belief that clients possess the necessary resources for change, that solutions need not be directly related to problems, and that small changes can precipitate larger systemic shifts. The therapeutic process is characterized by collaborative goal-setting, with the therapist adopting a stance of 'not-knowing' and curiosity about the client's unique perspective.","Several distinctive techniques define the SFBT approach. The miracle question invites clients to envision a future where the problem has been resolved overnight, thereby clarifying treatment goals and identifying concrete behavioral indicators of progress. Exception questions explore instances when the problem is absent or less severe, highlighting existing coping strategies and resources that can be amplified. Scaling questions enable clients to quantify their progress on a continuum, facilitating self-monitoring and reinforcing incremental change.","In school counseling contexts, SFBT offers several advantages. Its brevity aligns with the practical constraints of school settings, where counselors often manage large caseloads and limited session availability. The strengths-based orientation is particularly suitable for adolescents, who may be resistant to problem-focused approaches that emphasize deficits. Furthermore, the collaborative nature of SFBT empowers students, fostering autonomy and self-efficacy.","Research on SFBT in school settings has demonstrated promising outcomes, including reductions in externalizing and internalizing behaviors, improved academic engagement, and enhanced social functioning. However, the evidence base remains limited by methodological challenges, including small sample sizes, lack of randomized controlled designs, and insufficient attention to treatment integrity and long-term follow-up."],
zh:["焦點解決短期治療（SFBT）作為學校諮商情境中的有效治療取向，日益受到重視。SFBT由de Shazer與Berg發展，代表從缺陷取向模式轉向優勢本位、聚焦未來的促進改變取向。不同於強調問題分析與歷史探索的傳統治療模式，SFBT著重藉由放大個案既有的資源、優勢與問題的例外來建構解決之道。","SFBT的基本假設包括：相信個案具備改變所需的資源、解決方法不必與問題直接相關，以及小改變可引發更大的系統性轉變。治療歷程的特色是合作式的目標設定，治療師採取「無知」的立場，並對個案獨特的觀點保持好奇。","數項獨特技術定義了SFBT取向。奇蹟問句邀請個案想像問題一夜之間解決的未來，藉此釐清治療目標並找出進步的具體行為指標。例外問句探索問題不存在或較不嚴重的時刻，凸顯可被放大的既有因應策略與資源。量尺問句讓個案在連續尺度上量化自己的進展，促進自我監控並強化漸進式改變。","在學校諮商情境中，SFBT有幾項優勢。其短期性符合學校的現實限制，因輔導人員常須處理大量個案且可用會談次數有限。優勢本位的取向特別適合青少年，因他們可能抗拒強調缺陷的問題導向取向。此外，SFBT的合作本質賦權學生，培養自主性與自我效能。","SFBT在學校情境的研究已顯示有前景的成果，包括外化與內化行為減少、學業投入提升，以及社會功能增強。然而，證據基礎仍受方法學挑戰所限，包括小樣本、缺乏隨機對照設計，以及對處遇忠誠度與長期追蹤的關注不足。"],
qa:[["1. Main difference from traditional models? SFBT與傳統模式的主要區別？","傳統模式強調問題分析與歷史探索；SFBT從缺陷取向轉為優勢本位、聚焦未來，藉由放大個案既有資源、優勢與例外來建構解決方案。口說：Unlike traditional models, SFBT constructs solutions rather than analyzing problems."],["2. Three foundational assumptions? 三個基本假設？","①個案具備改變所需資源 ②解決方法不必與問題直接相關 ③小改變可引發更大的系統性轉變。治療師採取「無知」立場與好奇。"],["3. Purpose of the miracle question? 奇蹟問句的目的？","邀請個案想像問題一夜解決的未來，藉此釐清治療目標，並找出進步的具體行為指標。"],["4. How do exception questions help? 例外問句如何幫助個案？","探索問題不存在或較輕微的時刻，凸顯既有因應策略與資源，讓個案看見自己已有能力並加以放大。"],["5. Function of scaling questions? 量尺問句的功能？","讓個案在連續尺度上量化進展，促進自我監控，並強化漸進式改變（incremental change）。"],["6. Advantages in school counseling? 學校諮商的優勢？","①短期符合大量個案與有限會談次數 ②優勢取向適合抗拒問題導向的青少年 ③合作本質賦權學生，培養自主與自我效能。"],["7. Main limitations of the evidence? 證據的主要限制？","小樣本、缺乏隨機對照設計、處遇忠誠度與長期追蹤不足。口說：The evidence base remains limited, so more rigorous studies are needed."],["Bonus: how would you apply it? 延伸應用","口說：With a student who avoids class, I might ask when school feels slightly better, then use a scaling question to plan one small step. 連結你的教學背景：這與青少年的情境高度相關。"]]}

{t:"Direct and Indirect Effects of Psychological Well-Being and Therapeutic Alliance on Therapy Outcome in Eating Disorders",z:"心理幸福感與治療聯盟對飲食障礙治療結果的直接與間接效果（Muzi et al., 2024）",
en:["Outcome research in eating disorders (EDs) is commonly focused on psychopathological dysfunction. However, Ryff's model of psychological well-being (PWB) has shown promising results with ED patients. Despite substantial evidence linking the therapeutic alliance to treatment outcome, findings in ED samples remain unclear. This study explored the direct effect of PWB dimensions and the early therapeutic alliance on treatment response, and the mediating role of the early alliance between PWB and overall pre-post symptom change.","EDs are severe pathologies with persistent disturbances in eating or weight control behaviors. Meta-analyses report high dropout rates, limited outcomes, high mortality, low recovery rates, and frequent relapse, even after significant remission. The therapeutic alliance, the collaborative relationship between patient and therapist, has three elements: agreement on goals, consensus on tasks, and an affective bond. It reliably predicts outcome even after controlling for confounding variables such as setting and theoretical orientation, but the effect is less clear in EDs. Difficulties in self-regulation may hinder alliance formation, and the egosyntonic nature of EDs may reinforce ambivalence about change.","A sample of 165 ED patients in a residential program completed the Psychological Well-Being Scale at intake and the Working Alliance Inventory after the first four sessions. They completed the Outcome Questionnaire-45.2 at the same point and the week before discharge.","Autonomy, positive relations, and self-acceptance were associated with clinically significant change, while personal growth and self-acceptance were associated with reliable change. The early alliance had direct and indirect effects on outcome, predicting both kinds of symptom reduction, and mediated the relationship between all PWB dimensions and symptom change.","Identifying adaptive individual characteristics that influence the early alliance may help therapists predict ruptures and tailor interventions to enhance treatment effectiveness."],
zh:["飲食障礙（ED）的結果研究多聚焦於精神病理功能失調。然而Ryff的心理幸福感（PWB）模型在ED患者身上顯示出潛力。儘管有大量證據連結治療聯盟與治療結果，在ED樣本中的發現仍不明確。本研究探討PWB各向度與早期聯盟對治療反應的直接效果，以及早期聯盟在PWB與整體前後測症狀變化間的中介角色。","ED是嚴重的病理，特徵為進食或體重控制行為的持續困擾。後設分析指出中輟率高、成效有限、死亡率高、復原率低，且即使有顯著緩解後仍常復發。治療聯盟是病人與治療師的合作關係，含三要素：目標共識、任務共識與情感連結。即使控制治療情境與理論取向等混淆變項，它仍可穩定預測結果，但在ED族群中效果較不明確。自我調節困難可能妨礙聯盟形成，ED的自我協調特性也可能強化對改變的矛盾心理。","165位住院治療計畫中的ED患者，於入案時填寫心理幸福感量表，並於前四次會談後填寫工作聯盟量表。同時間及出院前一週填寫結果問卷OQ-45.2。","自主性、正向關係與自我接納與臨床顯著改變相關；個人成長與自我接納則與可靠改變相關。早期聯盟對結果有直接與間接效果，可預測兩類症狀減緩，並在所有PWB向度與症狀改變間扮演中介。","辨識影響早期聯盟的個人適應性特質，有助治療師預測關係破裂並調整介入以提升治療成效。"],
qa:[["1. What was the main aim?","探討PWB向度與早期聯盟對ED患者治療反應的直接效果，並檢驗早期聯盟在PWB與前後測症狀變化間的中介角色。"],["2. Three core elements of the alliance?","目標共識、任務共識、情感連結。"],["3. Measures used?","心理幸福感量表（PWB，入案）、工作聯盟量表（WAI，前四次會談後）、結果問卷OQ-45.2（入案同期與出院前一週）。"],["4. Which PWB dimensions relate to clinically significant change?","自主性、正向關係、自我接納。（個人成長與自我接納則關聯可靠改變）"],["5. Role of the alliance between PWB and outcome?","同時有直接效果與間接效果，是所有PWB向度與整體症狀改變間的顯著中介。"],["6. Clinical implication?","辨識個案的適應性特質，預測關係破裂並調整介入，以提升治療成效。口說：Therapists should attend to clients' strengths to build an early alliance."],["Limitation (professor may ask)","樣本為住院、出生性別為女性的ED患者，推論有限；為相關設計；皆為自陳量表。"]]},
{t:"Client Expectation about Counseling, Working Alliance, and Symptom Outcome",z:"個案對諮商的期待、工作聯盟與症狀結果：中國縱貫研究（Li et al., 2025）",
en:["This longitudinal study investigated how specific dimensions of client expectations about counseling relate to the initial level and subsequent trajectory of the working alliance and symptom change in psychotherapy conducted by Chinese beginning therapist trainees.","Participants included 173 Chinese therapist trainees and their 1,916 clients. At intake, clients rated their expectations on three dimensions: Client Involvement, Counselor Expertise, and Facilitative Conditions. Before every session, clients reported symptom severity; after every session, both therapists and clients rated the perceived strength of the working alliance.","Multilevel modeling showed that clients with higher initial symptoms had lower expectations on Client Involvement but higher expectations on Counselor Expertise. Clients with higher initial alliance ratings had higher expectations on Client Involvement and Facilitative Conditions. Clients with higher expectations on Counselor Expertise showed a greater average decrease in symptoms over therapy.","The findings confirm that client expectations, particularly for counselor expertise, are both a product of initial clinical factors and a predictor of therapeutic success. Implications are discussed, especially for the Chinese cultural context."],
zh:["本縱貫研究探討個案對諮商期待的特定向度，如何與中國新手治療師訓練生所做心理治療中，工作聯盟的初始水準與後續軌跡，以及症狀改變相關。","參與者包括173位中國治療師訓練生與其1,916位個案。入案時，個案就三個向度評估期待：個案投入、諮商師專業、促進性條件。每次會談前個案回報症狀嚴重度；每次會談後治療師與個案皆評估工作聯盟強度。","多層次模型顯示：初始症狀較重的個案，對個案投入的期待較低，但對諮商師專業的期待較高。初始聯盟評分較高者，對個案投入與促進性條件的期待較高。對諮商師專業期待較高者，療程中症狀平均下降幅度較大。","研究證實，個案期待（尤其是對諮商師專業）既是初始臨床因素的產物，也是治療成功的預測因子。文中討論了相關意涵，特別是中國文化脈絡。"],
qa:[["1. Who were the participants?","173位中國治療師訓練生（新手）與其1,916位個案。"],["2. Three dimensions of expectation?","個案投入、諮商師專業、促進性條件。"],["3. Higher initial symptoms: which expectation lower / higher?","對個案投入較低；對諮商師專業較高。（症狀重者傾向依賴專家）"],["4. Which expectation best relates to symptom improvement?","對諮商師專業的期待；越高，症狀下降越多。"],["5. Statistical method?","多層次模型（multilevel modeling），因會談巢套於個案、個案巢套於治療師。"],["6. Implication?","諮商初期可評估並回應個案期待（尤其專業期待），並考慮文化脈絡。口說：Counselors should explore client expectations at intake.這在華人社會尤其重要。"],["Limitation","新手治療師、單一文化樣本；期待與症狀皆自陳；相關而非因果。"]]});

{t:"Trauma-Informed Care in Counseling Practice: Principles and Applications",z:"創傷知情照護在諮商中的實踐：原則與應用",
en:["Trauma-informed care (TIC) represents a paradigm shift in mental health service delivery, moving from a model that asks 'What is wrong with you?' to one that asks 'What happened to you?' It recognizes the widespread prevalence of trauma and its impact on psychological functioning, relationships, and help-seeking. Rather than treating trauma as a separate diagnostic category, TIC integrates trauma awareness into all aspects of service delivery, ensuring environments are safe, trustworthy, and empowering.","SAMHSA identified six guiding principles: safety, trustworthiness and transparency, peer support, collaboration and mutuality, empowerment and choice, and cultural, historical, and gender issues. These are not treatment protocols but organizational and clinical guidelines.","Safety, the foundational principle, has physical and psychological dimensions. In counseling it means a predictable environment, clear boundaries, and attention to the client's sense of security. Many survivors experience hypervigilance and dysregulation of the autonomic nervous system, making safety a prerequisite for any therapeutic work.","Trustworthiness and transparency involve clear communication about expectations, session structure, and the rationale for interventions. Survivors often have experienced violations of trust, so therapists must show consistency and honesty. Collaboration and mutuality shift the power dynamic from hierarchical to shared, treating clients as active partners.","Empowerment and choice matter because trauma involves loss of control. Therapists offer choices whenever possible, validate decision-making capacity, and prioritize restoring autonomy. This is consistent with evidence-based treatments such as Cognitive Processing Therapy (CPT), Prolonged Exposure (PE), and EMDR, which emphasize client agency and collaborative planning."],
zh:["創傷知情照護（TIC）代表心理健康服務的典範轉移：從問「你哪裡有問題？」轉為問「你經歷了什麼？」它承認創傷的普遍性，及其對心理功能、人際關係與求助行為的深遠影響。TIC並非把創傷視為獨立診斷類別，而是把創傷意識融入服務的各個層面，確保環境安全、可信賴且具賦權性。","SAMHSA提出六項指導原則：安全、可信賴與透明、同儕支持、合作與互惠、賦權與選擇，以及文化、歷史與性別議題。這些不是治療流程，而是組織與臨床的指導方針。","安全是基礎原則，含身體與心理兩層面。在諮商中意指可預測的環境、清楚的界線，以及關注個案在關係中的安全感。許多倖存者有過度警覺與自律神經失調，使安全成為任何治療工作的前提。","可信賴與透明指清楚溝通期待、會談結構與介入理由。倖存者常經歷信任被侵犯，因此治療師須展現一致性與誠實。合作與互惠使權力關係由階層式轉為共享，視個案為積極的夥伴。","賦權與選擇之所以重要，是因創傷涉及失去控制。治療師盡可能提供選擇、肯定個案的決策能力，並優先恢復自主性。這與CPT、PE及EMDR等實證治療一致，它們都強調個案能動性與協作式計畫。"],
qa:[["1. Core shift in question?","從 'What is wrong with you?' 轉為 'What happened to you?'"],["2. SAMHSA's six principles?","安全；可信賴與透明；同儕支持；合作與互惠；賦權與選擇；文化、歷史與性別議題。"],["3. Two dimensions of safety?","身體安全與心理安全（可預測環境、清楚界線、安全感）。"],["4. Why trust and transparency?","倖存者常有信任被侵犯的經驗，需要治療師一致、可預測、誠實，並說明介入理由。"],["5. Meaning of empowerment and choice?","創傷＝失控，所以盡可能提供選擇、肯定決策能力、恢復自主。"],["6. Evidence-based trauma treatments mentioned?","CPT 認知處理治療、PE 延長暴露治療、EMDR。"],["Application to you","口說：I would explain the session structure and offer clients choices, such as pacing and topics. 並提及原則是指導方針，非操作手冊。"]]});
A.push(
{k:"考古一",t:"Transference in Counseling",z:"諮商中的移情",
en:["Transference refers to the process through which clients unconsciously transfer feelings, expectations, or relationship patterns from important people in their past onto the counselor. For example, a client who previously experienced criticism from a parent may assume that the counselor will also judge or reject them. Transference is not simply an obstacle to counseling. When handled carefully, it can provide useful information about the client’s interpersonal world.","Counselors should avoid immediately correcting the client or telling the client that the feeling is irrational. Instead, they may explore what happened in the counseling relationship and how the client understands the counselor’s behavior. Such exploration should be conducted with empathy and respect. If the counselor interprets transference too quickly, the client may feel misunderstood or exposed. Therefore, the timing and strength of the intervention are important. The counselor must also monitor personal emotional reactions, because the client’s behavior may evoke countertransference."],
zh:["移情是指個案將過去重要他人所引發的感受、期待或關係模式，在無意識中轉移到諮商師身上的過程。例如，一名過去曾經受到父母批評的個案，可能會認為諮商師也會批判或拒絕自己。移情不只是諮商中的阻礙；如果能夠謹慎處理，它也可以提供有關個案人際世界的重要資訊。","諮商師不應立即糾正個案，或告訴個案這種感受是不理性的。相反地，諮商師可以探索諮商關係中發生了什麼，以及個案如何理解諮商師的行為。這種探索應以同理與尊重為基礎。如果諮商師過快解釋移情，個案可能會感到不被理解，或覺得自己的內在經驗被暴露。因此，介入的時機與強度都很重要。諮商師也必須留意自己的情緒反應，因為個案的行為可能會引發反移情。"],
sum:"本文說明移情是個案將過去重要關係中的情感與期待無意識地投射到諮商師身上的過程。移情雖可能造成諮商困難，但也能幫助諮商師理解個案的人際模式。諮商師應以同理和尊重探索移情，避免過早解釋，並持續覺察自己的反移情。",
qa:[["What is transference?","個案無意識地把過去重要他人的感受、期待或關係模式，轉移到諮商師身上。口說：Transference is when clients unconsciously project feelings and relationship patterns from past figures onto the counselor. 例：被父母批評過的個案，預期諮商師也會批判他。"],["Why can transference be useful in counseling?","它不只是阻礙；謹慎處理時，能揭露個案的人際世界與慣有的關係模式，讓諮商師在當下的關係中理解並工作。口說：It reveals the client’s interpersonal patterns in the here and now."],["What may happen if a counselor interprets transference too quickly?","個案可能覺得不被理解或內在經驗被暴露，破壞安全感與聯盟。所以要重視介入的時機與強度，先以同理與尊重探索。口說：The client may feel misunderstood or exposed, so timing and strength matter."],["What is the difference between transference and countertransference?","移情是個案對諮商師的感受與期待（來自其過去關係）；反移情是諮商師被個案引發的情緒反應（可能與自身經驗有關）。前者看個案，後者要求諮商師自我覺察，並可透過督導處理。"]]},
{k:"考古二",t:"Social Interest in Adlerian Counseling",z:"阿德勒諮商中的社會興趣",
en:["In Adlerian theory, social interest refers to a person’s sense of belonging and willingness to contribute to the well-being of others. It is not limited to being sociable or spending time with many people. A person may have only a few relationships but still demonstrate social interest through cooperation, empathy, and responsibility.","Adlerian counselors view social interest as an important indicator of psychological adjustment. Clients who feel isolated, inferior, or excessively focused on competition may have difficulty experiencing connection with others. Counseling therefore aims not only to reduce symptoms but also to encourage clients to develop courage, cooperation, and meaningful participation in their communities.","For example, a student who believes that academic success determines personal worth may avoid classmates and become afraid of failure. The counselor may help the student examine this belief, recognize personal strengths, and gradually participate in cooperative activities. Through encouragement and new experiences, the student may develop a stronger sense of belonging."],
zh:["在阿德勒理論中，社會興趣是指個人的歸屬感，以及願意促進他人福祉的態度。社會興趣不只是善於社交，或經常與許多人相處。一個人即使只有少數幾段人際關係，仍然可能透過合作、同理與責任感展現社會興趣。","阿德勒取向的諮商師將社會興趣視為心理適應的重要指標。感到孤立、自卑，或過度關注競爭的個案，可能難以與他人建立連結。因此，諮商的目標不只是減輕症狀，也包括鼓勵個案培養勇氣、合作能力，並有意義地參與所屬社群。","例如，一名認為學業成就決定個人價值的學生，可能會躲避同學，並害怕失敗。諮商師可以協助學生檢視這項信念、看見自己的優勢，並逐步參與合作活動。透過鼓勵與新的經驗，學生可能發展出更強的歸屬感。"],
sum:"本文介紹阿德勒理論中的社會興趣，指出它包含歸屬感、合作、同理與對他人福祉的關心。阿德勒諮商認為，孤立、自卑與過度競爭可能反映社會興趣不足，因此諮商師會透過鼓勵、優勢探索及合作經驗，協助個案建立歸屬感與心理適應。",
qa:[["How do you define social interest?","個人的歸屬感，以及願意為他人福祉貢獻的態度，展現在合作、同理與責任感。口說：Social interest is a sense of belonging and a willingness to contribute to others’ well-being."],["Is social interest the same as being sociable?","不同。它不等於外向或朋友多；關係少的人也可以透過合作、同理與責任展現社會興趣。重點是品質與貢獻，不是社交量。"],["How can counselors increase a client’s social interest?","透過鼓勵、協助檢視自我設限的信念、看見個人優勢，並循序參與合作活動，培養勇氣、合作與有意義的社群參與。口說：Through encouragement, strengths exploration, and gradual cooperative experiences."],["How might this concept be applied to a junior high school student?","對象：因在意成績而躲避同學、害怕失敗的國中生。作法：先探索「成績決定價值」的信念，找出優勢，再從小組合作、班級服務等低風險活動開始，給予具體鼓勵。連結你的教學經驗：青少年的歸屬感常來自同儕與班級。"]]},
{k:"考古三",t:"The Therapeutic Alliance",z:"治療同盟",
en:["The therapeutic alliance is the collaborative relationship between a client and a counselor. It usually includes three elements: agreement on the goals of counseling, agreement on the tasks or methods used to achieve those goals, and the development of a trusting emotional bond. A strong alliance does not mean that the counselor and client always agree. Rather, it allows them to discuss differences openly and repair misunderstandings.","Research has consistently suggested that the quality of the therapeutic alliance is related to counseling outcomes. However, an alliance cannot be created simply by using a warm tone or showing kindness. Counselors need to understand the client’s perspective, explain the purpose of interventions, and invite feedback. They should also pay attention to signs of discomfort, such as silence, withdrawal, or repeated cancellations.","When a disagreement occurs, the counselor can acknowledge the difficulty and ask the client how the counseling process feels to them. This response communicates respect and may turn a difficult moment into an opportunity for deeper cooperation."],
zh:["治療同盟是個案與諮商師之間的合作關係，通常包括三項要素：雙方對諮商目標的共識、對達成目標所使用之方法或任務的共識，以及信任性的情感連結。強而有力的治療同盟並不表示諮商師與個案總是意見一致，而是表示雙方能夠公開討論差異，並修復彼此的誤解。","研究一再指出，治療同盟的品質與諮商結果有關。然而，治療同盟不能只靠親切的語氣或表現善意來建立。諮商師需要理解個案的觀點、說明介入的目的，並邀請個案提供回饋。諮商師也應注意個案不舒服的跡象，例如沉默、退縮或反覆取消會談。","當雙方發生意見不一致時，諮商師可以承認這個困難，並詢問個案對諮商過程的感受。這種回應傳達尊重，也可能把困難時刻轉化為深化合作的機會。"],
sum:"本文說明治療同盟是諮商師與個案之間的合作關係，包含諮商目標、方法及情感信任三個面向。良好的治療同盟不代表雙方沒有歧見，而是能夠討論差異並修復誤解。諮商師應理解個案觀點、說明介入目的、徵求回饋，並及早注意個案退縮或不適的訊號。",
qa:[["What are the three components of a therapeutic alliance?","①諮商目標共識 ②方法／任務共識 ③信任性的情感連結。口說：Goals, tasks, and an emotional bond."],["Does a strong alliance mean that the counselor and client always agree?","不是。強聯盟代表能公開討論差異並修復誤解，歧見處理得好反而深化關係。"],["How can a counselor respond when a client disagrees with an intervention?","承認這個困難，詢問個案對過程的感受，說明介入目的並邀請回饋；視為深化合作的機會。口說：I would acknowledge the difficulty and ask how the process feels to the client."],["What signs may indicate a weak therapeutic alliance?","沉默、退縮、反覆取消會談等不舒服的跡象。諮商師應及早覺察並主動詢問，而不是只靠親切語氣。"]]},
{k:"考古四",t:"Self-Disclosure in Counseling",z:"諮商中的諮商師自我揭露",
en:["Counselor self-disclosure occurs when a counselor shares personal information, feelings, or experiences with a client. Self-disclosure may help normalize the client’s experience and strengthen the therapeutic relationship. For instance, a brief statement that acknowledges the difficulty of making an important decision may help a client feel less alone.","However, self-disclosure can also shift attention away from the client. A counselor may disclose too much because of a need to be liked, a wish to reduce personal anxiety, or an attempt to solve the client’s problem quickly. Therefore, the counselor should consider the purpose, timing, length, and possible effect of the disclosure.","Before sharing personal information, counselors may ask themselves whether the disclosure serves the client’s goals rather than their own needs. They should also consider the client’s cultural background and the power difference within the counseling relationship. Appropriate self-disclosure is intentional, brief, and connected to the client’s needs."],
zh:["諮商師自我揭露是指諮商師向個案分享個人的資訊、感受或經驗。自我揭露可能有助於使個案的經驗正常化，並增進諮商關係。例如，諮商師簡短地表示理解做出重要決定的困難，可能會讓個案感到自己並不孤單。","然而，自我揭露也可能使注意力從個案身上轉移開來。諮商師可能因為想獲得個案喜歡、想降低自己的焦慮，或想快速解決個案的問題，而揭露過多。因此，諮商師應考量自我揭露的目的、時機、長度及可能產生的影響。","在分享個人資訊之前，諮商師可以先問自己：這項揭露是否服務於個案的目標，而不是滿足自己的需要？諮商師也應考慮個案的文化背景，以及諮商關係中的權力差異。適當的自我揭露應該是有意識的、簡短的，並且與個案的需要有關。"],
sum:"本文探討諮商師自我揭露的功能與風險。適當的自我揭露可能使個案感到被理解並促進諮商關係，但過度揭露可能讓焦點離開個案。諮商師在自我揭露前，應評估目的、時機、長度、文化背景及對個案的可能影響，確認其主要目的是服務個案，而非滿足自身需求。",
qa:[["What is counselor self-disclosure?（原文未列追問，依主題擬答）","諮商師向個案分享個人資訊、感受或經驗。口說：It is when a counselor shares personal information, feelings, or experiences with a client."],["What are the possible benefits?","使個案經驗正常化、感到不孤單，並增進諮商關係；例如簡短表示理解做重要決定的困難。"],["What are the risks?","注意力從個案轉移到諮商師；可能因想被喜歡、降低自己焦慮、快速解決問題而揭露過多。"],["How should a counselor decide whether to self-disclose?","先問：這是服務個案目標，還是滿足自己需要？並考量目的、時機、長度、可能影響、個案文化背景與權力差異。口說：Appropriate self-disclosure is intentional, brief, and connected to the client’s needs."]]});

if(i==-1){m.innerHTML=`<h1>諮商所複審・英文文獻互動複習書</h1><p class="sub">點擊綠色底線的專有名詞，即可看中文、音標並聽發音。</p><h2>使用流程</h2><p>① 進入文章，按「開始計時（選用）」（7.5分鐘，不查字）<br>② 讀完用自己的話口頭摘要<br>③ 按「整頁翻譯」對照<br>④ 先自己回答問題，再展開看最佳解答</p><h2>口說摘要框架</h2><p>This article is about… / The authors aimed to… / The study used… / The results showed that… / The findings suggest that counselors should… / I think this is important because…</p><h2>口試常見問題</h2><p>What is this article about? / What did the authors find? / How does this apply to your practice? / What are the limitations? / What theory does it relate to? / What would you do differently?</p><h2>閱讀技巧</h2><p>先讀標題→摘要→首末段；抓目的、方法、結果、結論；跳過人名與統計數字；遇生字從上下文推測；however、although、despite 後常接重要發現或限制。</p><h2>8週計畫</h2><p>週1–2：每天20詞造句；週3–4：練習一、二；週5–6：練習三、四；週7–8：練習五、六；週9起：六篇反覆快速摘要。</p><h2>考古題建議練習流程</h2><p>① 設定8分鐘倒數，先不看中文<br>② 第一遍只抓主旨，不查每個生字<br>③ 圈出轉折詞：however、therefore、rather、for example<br>④ 寫下四個中文關鍵詞：主題、核心概念、實務意義、限制或風險<br>⑤ 用中文說60秒摘要<br>⑥ 看翻譯，檢查有沒有誤解主詞、因果或術語<br>⑦ 用英文回答一題追問</p><h2>英文摘要架構</h2><p>This passage discusses… / The main idea is that… / The author points out that… / In counseling practice, this means that…</p><h2>中文摘要架構</h2><p>本文主要探討……。文章指出……。這個概念的重要性在於……。在諮商實務上，諮商師可以……，但也要注意……。</p><h2>文章目錄</h2>`+A.map((a,i)=>`<p><a href="#" onclick="go(${i});return false" style="color:var(--ac)">${a.k||"練習"+"一二三四五六"[i]}　${a.t}</a></p>`).join("");return}
